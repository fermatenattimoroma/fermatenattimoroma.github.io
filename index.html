<title>Fermate n'attimo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Bar, caffetteria, cocktail e tabaccheria in Via dei Cerchi 49, con vista sul Circo Massimo. Roma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Cinzel:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: one page per section (hash routes), dark nero-travertino ground, gold line art of Rome as the recurring thread,
   photos cross-dissolving behind editorial Bodoni headlines; Cinzel only for inscriptions (eyebrows, numerals). */
:root{
  --nero:#0e0d0b;
  --carbone:#171511;
  --pietra:#221f19;
  --travertino:#e9e1d2;
  --travertino-scuro:#d8ccb6;
  --avorio:#f4eee3;
  --inchiostro:#1c1914;
  --oro:#c9a45c;
  --oro-chiaro:#e3c98f;
  --pompei:#a8402f;
  --verde:#7fa86a;
  --fumo:rgba(244,238,227,.64);
  --fumo-2:rgba(244,238,227,.42);
  --linea:rgba(201,164,92,.30);
  --linea-chiara:rgba(28,25,20,.18);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-epigrafe:"Cinzel","Trajan Pro","Times New Roman",serif;
  --f-testo:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  --header-h:72px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--nero);color:var(--avorio);font-family:var(--f-testo);font-size:16.5px;line-height:1.6;font-weight:350;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--nero)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
::selection{background:var(--oro);color:var(--nero)}
:focus-visible{outline:2px solid var(--oro-chiaro);outline-offset:3px}
.wrap{max-width:1260px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.eyebrow{font-family:var(--f-epigrafe);font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;color:var(--oro);margin:0}
.num{font-family:var(--f-epigrafe);color:var(--oro);letter-spacing:.12em}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.04;letter-spacing:-.01em}
.display{font-size:clamp(2.6rem,6.4vw,5.6rem)}
.h2{font-size:clamp(2rem,4.2vw,3.4rem)}
.h3{font-size:clamp(1.4rem,2.4vw,1.9rem)}
em,.it{font-style:italic}
.lead{font-size:clamp(1.05rem,1.4vw,1.22rem);color:var(--fumo);max-width:62ch;font-weight:300}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--oro),transparent);border:0;margin:0}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(180deg,rgba(14,13,11,.92),rgba(14,13,11,.78));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.top .wrap{display:flex;align-items:center;gap:20px;height:var(--header-h)}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;flex:none}
.brand img{height:48px;width:auto}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{text-decoration:none;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;padding:10px 12px;color:var(--fumo);position:relative;transition:color .3s}
.nav a .n{display:block;font-family:var(--f-epigrafe);font-size:.62rem;letter-spacing:.2em;color:var(--oro);opacity:.7;text-align:center;margin-bottom:1px}
.nav a:hover,.nav a[aria-current="page"]{color:var(--avorio)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--oro)}
.track{width:118px;height:26px;flex:none;margin-left:6px}
.track path{fill:none;stroke:var(--linea);stroke-width:1}
.track .spina{stroke:var(--oro);opacity:.6}
.track-box .biga{display:block;offset-path:path("M13 3 H105 A10 10 0 0 1 105 23 H13 A10 10 0 0 1 13 3 Z");offset-rotate:auto;transition:offset-distance 1.1s cubic-bezier(.6,.1,.2,1);width:7px;height:7px;border-radius:50%;background:var(--oro-chiaro);box-shadow:0 0 10px var(--oro);position:absolute;left:0;top:0}
.track-box{position:relative;width:118px;height:26px;flex:none}
.lang{display:flex;border:1px solid var(--linea);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;padding:6px 10px;font-size:.72rem;letter-spacing:.14em;cursor:pointer;color:var(--fumo)}
.lang button[aria-pressed="true"]{background:var(--oro);color:var(--nero)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--linea);border-radius:999px;width:46px;height:46px;cursor:pointer;align-items:center;justify-content:center}
.burger span{display:block;width:18px;height:1px;background:var(--avorio);position:relative}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:18px;height:1px;background:var(--avorio)}
.burger span::before{top:-6px}.burger span::after{top:6px}
.drawer{position:fixed;inset:0;z-index:70;background:var(--nero);padding:calc(env(safe-area-inset-top,0px) + 24px) var(--gutter-r) 32px var(--gutter-l);display:flex;flex-direction:column;gap:6px;overflow:auto}
.drawer .close{align-self:flex-end;background:none;border:1px solid var(--linea);border-radius:999px;padding:10px 16px;cursor:pointer;letter-spacing:.2em;font-size:.72rem;text-transform:uppercase}
.drawer a{text-decoration:none;font-family:var(--f-display);font-size:2.3rem;line-height:1.15;display:flex;gap:18px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--linea)}
.drawer a .num{font-size:.9rem;width:2.6em}
.drawer .lang{align-self:flex-start;margin-top:18px}
@media (max-width:1100px){.nav a{padding:10px 8px;letter-spacing:.14em}.track-box{display:none}}
@media (max-width:900px){.nav,.top .lang{display:none}.burger{display:flex}}

/* ---------- views & transitions ---------- */
main{min-height:60vh}
.view{animation:vIn .7s cubic-bezier(.2,.7,.2,1) both}
.view.out{animation:vOut .28s ease both}
@keyframes vIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes vOut{to{opacity:0;transform:translateY(-8px)}}
.st{animation:vIn .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 90ms + 120ms)}

/* ---------- slideshows (dissolvenze) ---------- */
.slides{position:absolute;inset:0;overflow:hidden;background:var(--carbone)}
.slide{position:absolute;inset:-2%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.8s ease;filter:saturate(.88) contrast(1.06) brightness(.86) sepia(.06)}
.slide.on{opacity:1;animation:kb 12s ease-out both}
@keyframes kb{from{transform:scale(1.10) translate3d(1%,0,0)}to{transform:scale(1.0) translate3d(0,0,0)}}
.veil{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 18% 60%,rgba(14,13,11,.25),rgba(14,13,11,.75) 70%),
  linear-gradient(180deg,rgba(14,13,11,.55) 0%,rgba(14,13,11,0) 30%,rgba(14,13,11,.15) 60%,var(--nero) 100%)}

/* ---------- buttons ---------- */
.btn{line-height:1.2;display:inline-flex;align-items:center;gap:10px;text-decoration:none;padding:14px 26px;border-radius:999px;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--oro);cursor:pointer;transition:background .3s,color .3s,transform .3s;background:none}
.btn.gold{background:var(--oro);color:var(--nero)}
.btn.gold:hover{background:var(--oro-chiaro)}
.btn.ghost{color:var(--avorio)}
.btn.ghost:hover{background:rgba(201,164,92,.14)}
.btn.small{padding:9px 16px;font-size:.7rem}
.arrow{display:inline-block;width:22px;height:1px;background:currentColor;position:relative}
.arrow::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}

/* ---------- status pill ---------- */
.status{display:inline-flex;align-items:center;gap:10px;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;border:1px solid var(--linea);border-radius:999px;background:rgba(14,13,11,.45);backdrop-filter:blur(6px)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(127,168,106,.6);animation:pulse 2.4s infinite}
.status.closed .dot{background:var(--pompei);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,168,106,.55)}70%{box-shadow:0 0 0 10px rgba(127,168,106,0)}100%{box-shadow:0 0 0 0 rgba(127,168,106,0)}}

/* ---------- home hero ---------- */
.hero{position:relative;min-height:min(86vh,860px);display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero-in{position:relative;z-index:2;width:100%;padding-block:120px 150px;display:grid;gap:22px;justify-items:start}
.hero-logo{width:min(400px,72vw);height:auto;filter:drop-shadow(0 6px 30px rgba(0,0,0,.45))}
.tagline{font-family:var(--f-display);font-style:italic;font-size:clamp(1.4rem,2.6vw,2.1rem);margin:0;color:var(--avorio)}
.tagline small{display:block;font-family:var(--f-testo);font-style:normal;font-size:.8rem;letter-spacing:.26em;text-transform:uppercase;color:var(--fumo);margin-top:6px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.hero-meta{position:absolute;z-index:2;right:var(--gutter-r);top:110px;text-align:right;display:grid;gap:4px;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--fumo)}
.hero-meta .num{font-size:1.6rem;letter-spacing:.1em}
.skyline{position:absolute;left:0;right:0;bottom:0;z-index:2;width:100%;height:auto;pointer-events:none}
.skyline path,.skyline line,.skyline rect,.skyline circle{fill:none;stroke:var(--oro);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.2s cubic-bezier(.5,0,.2,1) forwards;animation-delay:.4s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (max-width:700px){.hero-meta{display:none}.hero-in{padding-block:90px 110px}}

/* ---------- moments ---------- */
.band{padding-block:clamp(64px,9vw,120px)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px;margin-bottom:44px}
.sec-head .lead{margin:0}
.moments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.moment{position:relative;text-decoration:none;display:flex;flex-direction:column;border-top:1px solid var(--linea);padding-top:20px;gap:14px}
.moment .ph{aspect-ratio:4/5;max-width:100%}
.moment .time{font-family:var(--f-display);font-size:clamp(2.4rem,4vw,3.4rem);line-height:1;font-variant-numeric:tabular-nums;color:var(--avorio)}
.moment .time sup{font-family:var(--f-epigrafe);font-size:.8rem;letter-spacing:.2em;color:var(--oro);vertical-align:top;margin-left:8px}
.moment h3{font-size:1.5rem}
.moment p{margin:0;color:var(--fumo)}
.moment.now .time{color:var(--oro-chiaro)}
.moment .now-tag{position:absolute;top:20px;right:0;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--nero);background:var(--oro);padding:4px 10px;border-radius:999px}
@media (max-width:860px){.moments{grid-template-columns:1fr}.moment .ph{aspect-ratio:16/10}}

.ph{position:relative;overflow:hidden;background:var(--carbone)}
.ph img{width:100%;height:100%;object-fit:cover;filter:saturate(.86) contrast(1.06) brightness(.9) sepia(.05);transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter .8s}
a:hover .ph img,.ph:hover img{transform:scale(1.045);filter:saturate(1) contrast(1.04) brightness(1)}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(14,13,11,.55));pointer-events:none}
.duo{position:relative}
.duo img+img{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.duo:hover img+img,.duo.flip img+img{opacity:1}

/* ---------- inscription (travertino) ---------- */
.travertino{background-color:var(--travertino);color:var(--inchiostro);position:relative;isolation:isolate}
.travertino::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.55;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='300'><filter id='t'><feTurbulence type='fractalNoise' baseFrequency='.012 .09' numOctaves='4' seed='7'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .38  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23t)'/></svg>");background-size:600px 300px}
.travertino .eyebrow{color:#8a6a2c}
.travertino .lead{color:rgba(28,25,20,.72)}
.inscr{text-align:center;display:grid;justify-items:center;gap:18px}
.inscr .latin{font-family:var(--f-epigrafe);font-size:clamp(2.4rem,7vw,6.2rem);letter-spacing:.14em;line-height:1;margin:0;font-weight:500}
.inscr .latin span{color:#8a6a2c}
.inscr .tr{font-family:var(--f-display);font-style:italic;font-size:clamp(1.2rem,2vw,1.6rem);margin:0}
.inscr .src{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(28,25,20,.6);max-width:60ch}

/* ---------- marquee ---------- */
.marquee{border-block:1px solid var(--linea);overflow:hidden;white-space:nowrap;padding-block:18px}
.marquee div{display:inline-flex;gap:46px;animation:mq 46s linear infinite;padding-left:46px}
.marquee span{font-family:var(--f-epigrafe);letter-spacing:.3em;font-size:.9rem;color:var(--fumo)}
.marquee span b{color:var(--oro);font-weight:400}
@keyframes mq{to{transform:translateX(-50%)}}

.highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.hl{border:1px solid var(--linea);padding:28px;display:grid;gap:10px;align-content:start;background:linear-gradient(160deg,rgba(201,164,92,.07),transparent 60%)}
.hl h3{font-size:1.55rem}
.hl p{margin:0;color:var(--fumo)}

/* ---------- page head ---------- */
.phead{position:relative;min-height:440px;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.phead .wrap{position:relative;z-index:2;width:100%;padding-block:150px 56px;display:grid;gap:16px}
.phead .display{max-width:16ch}
.phead .lead{margin:0}
.phead.top-crop .slide{background-position:center 22%}

/* ---------- menu ---------- */
.mtabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--header-h));z-index:30;background:rgba(14,13,11,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea)}
.mtabs .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:12px}
.mtabs .wrap::-webkit-scrollbar{display:none}
.mtab{flex:none;display:flex;align-items:center;gap:12px;text-decoration:none;padding:8px 18px 8px 8px;border-radius:999px;border:1px solid transparent;color:var(--fumo);transition:all .3s}
.mtab .ic{width:42px;height:42px;border-radius:50%;border:1px solid var(--oro);display:grid;place-items:center;color:var(--oro)}
.mtab .ic svg{width:20px;height:20px}
.mtab b{display:block;font-weight:400;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:inherit}
.mtab small{display:block;font-size:.7rem;color:var(--fumo-2);letter-spacing:.06em}
.mtab[aria-current="true"]{border-color:var(--linea);background:rgba(201,164,92,.1);color:var(--avorio)}
.mtab[aria-current="true"] .ic{background:var(--oro);color:var(--nero)}
.mbody{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(28px,5vw,80px);padding-block:56px 100px}
.mside{position:sticky;top:calc(var(--header-h) + 100px);align-self:start;display:grid;gap:18px}
.mside .ph{aspect-ratio:4/5}
.mside .cap{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--fumo-2)}
.msec{margin-bottom:56px}
.msec-h{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--oro);padding-bottom:12px;margin-bottom:8px;flex-wrap:wrap}
.msec-h .num{font-size:1rem;width:2.4em}
.msec-h h2{font-size:clamp(1.8rem,3vw,2.5rem)}
.msec-h .note{margin-left:auto;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--oro)}
.items{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:baseline;gap:12px;padding:13px 0;border-bottom:1px dashed rgba(201,164,92,.16)}
.item .nm{min-width:0}
.item .nm b{font-family:var(--f-display);font-weight:400;font-size:1.28rem}
.item .nm small{display:block;color:var(--fumo-2);font-size:.86rem;margin-top:2px}
.item .dots{flex:1;border-bottom:1px dotted rgba(201,164,92,.45);transform:translateY(-5px);min-width:20px}
.item .pr{font-variant-numeric:tabular-nums lining-nums;font-family:var(--f-display);font-size:1.18rem;color:var(--oro-chiaro);white-space:nowrap}
.item .pr i{font-style:normal;font-size:.8em;color:var(--oro);margin-right:4px}
.cgroup-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.mfoot{color:var(--fumo-2);font-size:.86rem;border-top:1px solid var(--linea);padding-top:18px}
@media (max-width:900px){.mbody{grid-template-columns:1fr}.mside{position:static;grid-row:1}.mside .ph{aspect-ratio:16/10}}

/* ---------- cocktail page ---------- */
.ck-hero{min-height:min(80vh,780px)}
.ck-hero .display{font-style:italic;font-size:clamp(3rem,9vw,8rem);max-width:none}
.look{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(28px,6vw,90px);align-items:center;padding-block:clamp(56px,8vw,110px);border-bottom:1px solid var(--linea)}
.look:nth-child(even) .look-ph{order:2}
.look-ph{aspect-ratio:4/5;max-width:100%}
.look-ph .roman{position:absolute;z-index:2;left:22px;bottom:16px;font-family:var(--f-epigrafe);font-size:4.4rem;color:var(--avorio);opacity:.9;line-height:1}
.look h2{font-size:clamp(2.4rem,5vw,4.4rem);font-style:italic}
.price-big{font-family:var(--f-display);font-size:clamp(2.2rem,4vw,3.4rem);color:var(--oro-chiaro);font-variant-numeric:lining-nums;line-height:1}
.price-big small{font-family:var(--f-testo);font-size:.8rem;letter-spacing:.2em;color:var(--fumo);text-transform:uppercase;margin-left:10px}
.drinks{list-style:none;padding:0;margin:26px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 34px}
.drinks li{padding:12px 0;border-bottom:1px solid var(--linea)}
.drinks b{font-family:var(--f-display);font-weight:400;font-size:1.35rem;display:block}
.drinks span{color:var(--fumo-2);font-size:.88rem}
@media (max-width:860px){.look{grid-template-columns:1fr}.look:nth-child(even) .look-ph{order:0}.look-ph{aspect-ratio:16/11}.drinks{grid-template-columns:1fr}}

/* ---------- tabaccheria ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,6vw,90px);align-items:center}
.stack{position:relative;aspect-ratio:1/1;max-width:100%}
.stack .ph{position:absolute}
.stack .a{inset:0 22% 18% 0}
.stack .b{inset:38% 0 0 46%;border:6px solid var(--nero)}
.services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--linea);border-left:1px solid var(--linea)}
.svc{border-right:1px solid var(--linea);border-bottom:1px solid var(--linea);padding:30px 26px;display:grid;gap:16px;align-content:start;transition:background .4s}
.svc:hover{background:rgba(201,164,92,.07)}
.svc svg{width:38px;height:38px;color:var(--oro)}
.svc b{font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.2}
@media (max-width:860px){.split{grid-template-columns:1fr}.services{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.services{grid-template-columns:1fr}}

/* ---------- storia ---------- */
.story{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,6vw,90px);align-items:start}
.story .txt p{font-size:1.15rem;line-height:1.75;margin:0 0 1em;max-width:60ch}
.story .txt p:first-of-type::first-letter{font-family:var(--f-display);float:left;font-size:4.6em;line-height:.82;padding:6px 12px 0 0;color:#8a6a2c}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--linea-chiara)}
.fact{padding:26px 18px 6px 0;display:grid;gap:4px;border-right:1px solid var(--linea-chiara);padding-left:18px}
.fact:first-child{padding-left:0}
.fact:last-child{border-right:0}
.fact .rn{font-family:var(--f-epigrafe);font-size:clamp(1.6rem,3vw,2.6rem);color:#8a6a2c;line-height:1}
.fact .ar{font-family:var(--f-display);font-size:1.25rem;font-variant-numeric:lining-nums}
.fact small{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(28,25,20,.6)}
@media (max-width:860px){.story{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.fact:nth-child(2){border-right:0}.fact:nth-child(3){padding-left:0}}
.gallery{columns:4 240px;column-gap:14px}
.gallery button{display:block;width:100%;border:0;padding:0;margin:0 0 14px;cursor:zoom-in;background:var(--carbone);break-inside:avoid}
.gallery .ph img{height:auto}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(10,9,8,.96);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 60px) var(--gutter-r) 60px var(--gutter-l)}
.lightbox img{max-height:82vh;max-width:min(1200px,100%);width:auto;object-fit:contain;animation:vIn .5s both}
.lightbox .lb-btn{position:absolute;background:rgba(14,13,11,.6);border:1px solid var(--linea);border-radius:999px;width:52px;height:52px;cursor:pointer;font-size:1.3rem;color:var(--avorio)}
.lb-close{top:calc(env(safe-area-inset-top,0px) + 14px);right:var(--gutter-r)}
.lb-prev{left:var(--gutter-l);top:50%}
.lb-next{right:var(--gutter-r);top:50%}

/* ---------- contatti ---------- */
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,6vw,90px)}
.bigtel{font-family:var(--f-display);font-size:clamp(2.4rem,5.4vw,4.4rem);line-height:1;font-variant-numeric:lining-nums;user-select:all;letter-spacing:.01em}
.cinfo{display:grid;gap:26px}
.cinfo .row{display:grid;gap:6px;border-top:1px solid var(--linea);padding-top:18px}
.cinfo .row p{margin:0;font-size:1.15rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hours{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hours td{padding:12px 0;border-bottom:1px solid var(--linea);font-size:1.05rem}
.hours td:last-child{text-align:right;font-family:var(--f-display);font-size:1.15rem}
.hours tr.today td{color:var(--oro-chiaro)}
.hours tr.today td:first-child::after{content:" · oggi";font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--oro)}
html[lang="en"] .hours tr.today td:first-child::after{content:" · today"}
.mapbox{border:1px solid var(--linea);margin-top:30px;padding:18px;background:var(--carbone)}
.mapbox svg{width:100%;height:auto;display:block}
.mapbox text{font-family:var(--f-epigrafe);fill:var(--fumo);letter-spacing:.18em}
@media (max-width:860px){.contact{grid-template-columns:1fr}}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--linea);margin-top:0;position:relative;padding-top:0}
.fsky{display:block;width:100%;height:auto;opacity:.75}
.fsky path,.fsky line,.fsky rect,.fsky circle{fill:none;stroke:var(--oro);stroke-width:1;vector-effect:non-scaling-stroke}
.fgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:34px;padding-block:44px}
.fgrid img{width:200px;height:auto}
.fgrid h4{margin:0 0 10px;font-family:var(--f-epigrafe);font-weight:400;font-size:.74rem;letter-spacing:.28em;color:var(--oro);text-transform:uppercase}
.fgrid p{margin:0;color:var(--fumo);font-size:.95rem}
.fgrid a{text-decoration:none}
.fgrid a:hover{color:var(--oro-chiaro)}
.legal{border-top:1px solid var(--linea);padding-block:18px 26px;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.76rem;color:var(--fumo-2);letter-spacing:.06em}
.legal .mm{text-decoration:none;cursor:default;color:inherit}
@media (max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:95;background:var(--oro);color:var(--nero);padding:12px 22px;border-radius:999px;font-size:.88rem;letter-spacing:.04em;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* ---------- admin ---------- */
.adm{padding-block:48px 100px}
.login{max-width:420px;margin:40px auto;border:1px solid var(--linea);padding:34px;display:grid;gap:16px;background:var(--carbone)}
.login img{width:180px;height:auto;margin:0 auto 6px}
label.f{display:grid;gap:6px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fumo)}
.f input,.f textarea,.f select,.inp{font:inherit;font-size:1rem;letter-spacing:0;text-transform:none;color:var(--avorio);background:var(--nero);border:1px solid rgba(201,164,92,.35);border-radius:6px;padding:10px 12px;width:100%}
.f textarea{min-height:110px;resize:vertical;line-height:1.5}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--oro);outline:none}
.err{color:#e48a78;font-size:.9rem;margin:0}
.adm-grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:34px;align-items:start}
.adm-nav{position:sticky;top:calc(var(--header-h) + 96px);display:grid;gap:2px}
.adm-nav button{text-align:left;background:none;border:0;border-left:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--fumo);font-size:.95rem}
.adm-nav button[aria-current="true"]{border-color:var(--oro);color:var(--avorio);background:rgba(201,164,92,.08)}
.adm-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--header-h));z-index:20;background:rgba(23,21,17,.97);border:1px solid var(--linea);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px}
.adm-bar .msg{margin-right:auto;font-size:.92rem;color:var(--fumo)}
.adm-bar .msg.dirty{color:var(--oro-chiaro)}
.ed{display:grid;gap:14px}
.ed-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{border:1px solid rgba(201,164,92,.22);border-radius:8px;padding:16px;display:grid;gap:14px;background:rgba(23,21,17,.6)}
.card-h{display:flex;align-items:center;gap:8px}
.card-h b{margin-right:auto;font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.ib{background:none;border:1px solid rgba(201,164,92,.3);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:.82rem;color:var(--fumo)}
.ib:hover{border-color:var(--oro);color:var(--avorio)}
.ib.danger.arm{background:var(--pompei);color:var(--avorio);border-color:var(--pompei)}
.add{justify-self:start}
.arr-h{font-family:var(--f-epigrafe);letter-spacing:.2em;font-size:.8rem;color:var(--oro);text-transform:uppercase;margin:10px 0 0}
.imgpick{display:flex;gap:10px;align-items:center}
.imgpick img{width:64px;height:48px;object-fit:cover;border-radius:4px;flex:none;background:var(--pietra)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip img{width:84px;height:62px;object-fit:cover;border-radius:4px}
.chip button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--pompei);color:#fff;cursor:pointer;font-size:.8rem;line-height:1}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.photo{border:1px solid rgba(201,164,92,.22);border-radius:8px;overflow:hidden;background:var(--carbone);display:grid}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover}
.photo div{padding:10px;display:grid;gap:8px;font-size:.85rem}
.photo label.ib{text-align:center}
.photo input[type=file]{display:none}
.hint{font-size:.88rem;color:var(--fumo-2);margin:0}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--fumo)}
.chk input{width:18px;height:18px;accent-color:var(--oro)}
@media (max-width:860px){.adm-grid{grid-template-columns:1fr}.adm-nav{position:static;display:flex;overflow-x:auto}.adm-nav button{border-left:0;border-bottom:2px solid transparent;white-space:nowrap}.adm-nav button[aria-current="true"]{border-color:var(--oro)}}


/* arco: Roman arch-shaped frames */
.arch{border-radius:999px 999px 0 0;overflow:hidden}
.arch::before{content:"";position:absolute;inset:10px 10px 0;border:1px solid rgba(227,201,143,.55);border-bottom:0;border-radius:999px 999px 0 0;z-index:3;pointer-events:none}
.hero-arch{position:absolute;z-index:2;right:max(var(--gutter-r), calc((100vw - 1260px)/2 + 16px));bottom:118px;width:clamp(240px,24vw,340px);aspect-ratio:3/4.4;max-width:100%;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.hero-arch .duo,.hero-arch .ph{position:absolute;inset:0}
.hero-arch .duo img{position:absolute;inset:0;height:100%}
.hero-arch figcaption{position:absolute;z-index:4;left:0;right:0;bottom:14px;text-align:center;font-family:var(--f-epigrafe);font-size:.68rem;letter-spacing:.3em;color:var(--avorio);text-shadow:0 1px 8px rgba(0,0,0,.7)}
@media (max-width:980px){.hero-arch{display:none}}
.mside .ph.arch{aspect-ratio:3/4}
.look-ph.arch{aspect-ratio:3/4}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .skyline path,.skyline line,.skyline rect,.skyline circle{stroke-dashoffset:0}
  .marquee div{animation:none}
}

function romeNow(){

  const wd = {Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[g('weekday')] ?? 0;
  return {day:wd, min: (+g('hour'))%24*60 + (+g('minute'))};
}
const toMin = s => { const m = /^(\d{1,2})[:.](\d{2})/.exec(s||''); return m ? (+m[1])*60 + (+m[2]) : null; };
function status(){
  const {day,min} = romeNow(); const d = C.hours.days;
  const t = d[day];
  if (t && !t.closed && min >= toMin(t.open) && min < toMin(t.close)) return {open:true, text:`${u('openNow')} · ${u('closesAt')} ${t.close}`};
  if (t && !t.closed && min < toMin(t.open)) return {open:false, text:`${u('closed')} · ${u('opensAt')} ${t.open}`};
  for (let i=1;i<=7;i++){ const n=d[(day+i)%7]; if (n && !n.closed) return {open:false, text:`${u('closed')} · ${u('opensAt')} ${n.open}${i===1?' '+u('tomorrow'):' · '+T(n,'day')}`}; }
  return {open:false,text:u('closed')};
}

  while (i<7){ let j=i; const key = x => x.closed ? 'x' : x.open+'-'+x.close; while (j+1<7 && key(d[j+1])===key(d[i])) j++;
    const lbl = i===j ? T(d[i],'day') : `${T(d[i],'day').slice(0,3)}–${T(d[j],'day').slice(0,3)}`;
    out.push([lbl, d[i].closed ? u('closed') : `${d[i].open}–${d[i].close}`]); i=j+1; }

}

function vAdmin(){
  if (!authed) return `<div class="wrap adm"><form class="login" id="login" autocomplete="off">
    <img src="img/logo-oro.png" alt="" width="180" height="141">
    <p class="eyebrow" style="text-align:center">Area riservata</p>
    <label class="f">Password<input type="password" id="pw" required autofocus></label>
    <p class="err" id="pwerr" hidden>Password errata. Riprova.</p>
    <button class="btn gold" type="submit" style="justify-content:center">Entra</button>
    <button class="ib" type="button" id="forgot" style="justify-self:center">Password dimenticata?</button>
    <div id="reset" hidden style="display:grid;gap:14px;border-top:1px solid var(--linea);padding-top:16px">
      <p class="hint" id="resethint">Inserisci il codice di recupero e scegli una nuova password.</p>
      <label class="f" id="rcwrap">Codice di recupero<input type="text" id="rc" autocomplete="off" spellcheck="false"></label>
      <label class="f">Nuova password<input type="password" id="rp1"></label>
      <label class="f">Ripeti la nuova password<input type="password" id="rp2"></label>
      <p class="err" id="rerr" hidden></p>
      <button class="btn small gold" type="button" id="doreset" style="justify-content:center">Reimposta la password</button>
    </div>
    <a href="#home" class="hint" style="text-align:center">Torna al sito</a>
  </form></div>`;
  return `<div class="wrap adm">
    <div class="adm-bar" id="admbar">
      <span class="msg ${dirty?'dirty':''}" id="admmsg">${esc(admMsg || (dirty?'Modifiche non ancora pubblicate.':'Tutto pubblicato.'))}</span>
      <button class="btn small gold" type="button" id="save">Pubblica le modifiche</button>
      <button class="btn small ghost" type="button" id="undo">Annulla modifiche</button>
      <button class="btn small ghost" type="button" id="logout">Esci</button>
    </div>
    <div class="adm-grid">
      <nav class="adm-nav">${ADM_SECTIONS.map(([id,l])=>`<button type="button" data-sec="${id}" aria-current="${id===admSec}">${l}</button>`).join('')}</nav>
      <div id="edbox">${edSection()}</div>
    </div>
    <div id="fallback"></div>
  </div>`;
}
function edSection(){
  const s = ADM_SECTIONS.find(x=>x[0]===admSec);
  if (admSec==='foto') return edPhotos();
  if (admSec==='password') return `<div class="card" style="max-width:520px"><b class="h3">Cambia password</b>
    <label class="f">Nuova password<input type="password" id="np1"></label><label class="f">Ripeti la nuova password<input type="password" id="np2"></label>
    <p class="err" id="nperr" hidden></p><button class="btn small gold" type="button" id="setpw" style="justify-self:start">Imposta la password</button>
    <p class="hint">Dopo averla impostata premi “Pubblica le modifiche”. La password protegge questa pagina dai visitatori curiosi; a pubblicare davvero può essere solo chi gestisce il sito.</p></div>
    <div class="card" style="max-width:520px;margin-top:18px"><b class="h3">Codice di recupero</b>
    <p class="hint">Serve a reimpostare la password se la dimentichi (“Password dimenticata?” nella schermata di accesso). Generane uno nuovo, scrivilo da qualche parte e poi pubblica.</p>
    <p class="bigtel" id="rcode" style="font-size:1.6rem;letter-spacing:.08em" hidden></p>
    <button class="btn small ghost" type="button" id="newrc" style="justify-self:start">Genera un nuovo codice</button></div>`;
  const pageLink = {home:'#home',hours:'#contatti',menu:'#menu',cocktail:'#cocktail',tabaccheria:'#tabaccheria',storia:'#storia',contatti:'#contatti'}[admSec];
  return `<div class="ed"><div class="card-h"><b class="h3">${s[1]}</b><a class="ib" href="${pageLink}">Vedi la pagina ↗</a></div>
    ${s[2].map(k=>`${s[2].length>1?`<p class="arr-h">${LBL[k]||k}</p>`:''}${edObj(C[k],[k])}`).join('')}</div>`;
}
const P = p => esc(JSON.stringify(p));
function edObj(o, path){
  const scal = [], comp = [];
  for (const [k,v] of Object.entries(o)){ if (HIDE.has(k)) continue; (typeof v==='object' && v!==null ? comp : scal).push([k,v]); }
  return `<div class="ed-grid">${scal.map(([k,v])=>edField(k,v,[...path,k])).join('')}</div>${comp.map(([k,v])=>edComplex(k,v,[...path,k])).join('')}`;
}
function edField(k, v, path){
  const lbl = esc(LBL[k]||k);
  if (typeof v === 'boolean') return `<label class="chk"><input type="checkbox" data-p="${P(path)}" ${v?'checked':''}> ${lbl}</label>`;
  if (IMGKEYS.has(k)) return `<label class="f">${lbl}<span class="imgpick"><img src="${IMG(v)}" alt=""><select data-p="${P(path)}">${Object.keys(C.images).map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></span></label>`;
  if (k==='icon') return `<label class="f">${lbl}<select data-p="${P(path)}">${Object.keys(ICONS).map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select></label>`;
  if (k==='link') return `<label class="f">${lbl}<select data-p="${P(path)}">${LINKS.map(x=>`<option ${x===String(v).replace('/','-')?'selected':''}>${x}</option>`).join('')}</select></label>`;
  const long = /^(text|intro)_/.test(k) || String(v).length > 90;
  return `<label class="f" style="${long?'grid-column:1/-1':''}">${lbl}${long?`<textarea data-p="${P(path)}">${esc(v)}</textarea>`:`<input type="text" data-p="${P(path)}" value="${esc(v)}">`}</label>`;
}
function edComplex(k, v, path){
  const lbl = esc(LBL[k]||k);
  if (Array.isArray(v) && IMGARR.has(k)) return `<p class="arr-h">${lbl}</p><div class="chips">${v.map((x,i)=>`<span class="chip"><img src="${IMG(x)}" alt="${esc(x)}" title="${esc(x)}"><button type="button" data-delimg="${P([...path,i])}" aria-label="Togli">✕</button></span>`).join('')}</div>
    <label class="f" style="max-width:340px">Aggiungi una foto<select data-addimg="${P(path)}"><option value="">Scegli…</option>${Object.keys(C.images).map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>`;
  if (Array.isArray(v)) {
    const fixed = k==='days';
    return `<p class="arr-h">${lbl}</p><div class="ed">${v.map((it,i)=>`<div class="card"><div class="card-h"><b>${esc(itemTitle(it))}</b>
      ${fixed?'':`<button class="ib" type="button" data-mv="${P([...path,i])}" data-d="-1" aria-label="Sposta su">↑</button><button class="ib" type="button" data-mv="${P([...path,i])}" data-d="1" aria-label="Sposta giù">↓</button><button class="ib danger" type="button" data-del="${P([...path,i])}">Elimina</button>`}</div>
      ${typeof it==='object' ? edObj(it,[...path,i]) : edField(k,it,[...path,i])}</div>`).join('')}
      ${fixed?'':`<button class="ib add" type="button" data-add="${P(path)}">+ Aggiungi ${esc((LBL[k]||'voce').toLowerCase())}</button>`}</div>`;
  }
  return `<p class="arr-h">${lbl}</p>${edObj(v,path)}`;
}
function edPhotos(){
  return `<div class="ed"><b class="h3">Foto</b><p class="hint" id="uphint">Ogni foto ha un nome: le pagine la richiamano con quel nome. Sostituendola qui cambia ovunque compaia.</p>
  <div class="photos">${Object.entries(C.images).map(([k,v])=>`<div class="photo"><img src="${esc(v)}" alt="${esc(k)}"><div><b>${esc(k)}</b>
    <label class="ib" data-up>Sostituisci<input type="file" accept="image/*" data-upk="${esc(k)}"></label></div></div>`).join('')}
    <div class="photo" style="place-content:center;min-height:200px"><div style="text-align:center"><label class="ib" data-up>+ Nuova foto<input type="file" accept="image/*" data-upk=""></label></div></div>
  </div></div>`;
}
const getP = (path) => path.reduce((o,k)=>o[k], C);
function setP(path, val){ const last=path[path.length-1]; const o=getP(path.slice(0,-1)); o[last]=val; }
function blank(x){ if (Array.isArray(x)) return []; if (x && typeof x==='object'){ const o={}; for (const k in x) o[k]= (k==='id')? 'nuova-'+Date.now().toString(36) : blank(x[k]); return o; } if (typeof x==='boolean') return false; return ''; }
function markDirty(){ dirty=true; admMsg=''; const m=$('#admmsg'); if (m){ m.textContent='Modifiche non ancora pubblicate.'; m.classList.add('dirty'); } }
function redrawEd(){ const y=scrollY; $('#edbox').innerHTML=edSection(); scrollTo(0,y); }
function initAdmin(){
  const lf = $('#login');
  if (lf){
    lf.addEventListener('submit', async e => { e.preventDefault(); try{ const h = await sha($('#pw').value); if (h===C.admin.hash){ authed=true; try{sessionStorage.setItem('fna-auth','1')}catch(_){}; render(); } else $('#pwerr').hidden=false; } catch(err){ $('#pwerr').textContent='Questo browser non supporta l’accesso sicuro.'; $('#pwerr').hidden=false; } });
    let ownerReset = false;
    $('#forgot').addEventListener('click', async () => {
      const r=$('#reset'); r.hidden=!r.hidden; if (r.hidden) return;
      const usr = await claudeUse('user');
      let can=false; try { can = !!(usr && (await usr.canEdit())); } catch(_){}
      if (can){ ownerReset=true; $('#rcwrap').hidden=true; $('#resethint').textContent='Sei il gestore del sito: puoi scegliere subito una nuova password, senza codice.'; }
    });
    $('#doreset').addEventListener('click', async () => {
      const er=$('#rerr'), a=$('#rp1').value, b=$('#rp2').value;
      const fail = t => { er.textContent=t; er.hidden=false; };
      if (!ownerReset){ const code=($('#rc').value||'').trim().toUpperCase(); if (!code || await sha(code)!==C.admin.recovery) return fail('Codice di recupero non valido.'); }
      if (a.length<6) return fail('La password deve avere almeno 6 caratteri.');
      if (a!==b) return fail('Le due password non coincidono.');
      C.admin.hash = await sha(a); authed=true; try{sessionStorage.setItem('fna-auth','1')}catch(_){}
      admSec='password'; dirty=true; admMsg='Nuova password impostata: premi “Pubblica le modifiche” per salvarla.'; render();
    });
    return;
  }
  const box = $('.adm');
  box.addEventListener('input', e => { const el=e.target.closest('[data-p]'); if (!el) return; const path=JSON.parse(el.dataset.p); setP(path, el.type==='checkbox'?el.checked:el.value); markDirty(); if (el.tagName==='SELECT' && IMGKEYS.has(path[path.length-1])) { const im = el.parentElement.querySelector('img'); if (im) im.src = C.images[el.value]||''; } });
  box.addEventListener('change', async e => {
    const ai = e.target.closest('[data-addimg]'); if (ai && ai.value){ getP(JSON.parse(ai.dataset.addimg)).push(ai.value); markDirty(); redrawEd(); return; }
    const up = e.target.closest('[data-upk]'); if (up && up.files[0]) await uploadPhoto(up.files[0], up.dataset.upk);
  });
  box.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.sec){ admSec=b.dataset.sec; $$('.adm-nav button').forEach(x=>x.setAttribute('aria-current', x===b)); redrawEd(); return; }
    if (b.dataset.add){ const arr=getP(JSON.parse(b.dataset.add)); arr.push(arr.length?blank(arr[0]):{name:'',price:''}); markDirty(); redrawEd(); return; }
    if (b.dataset.del){ if (!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent='Conferma'; setTimeout(()=>{b.classList.remove('arm'); b.textContent='Elimina';},3000); return; }
      const p=JSON.parse(b.dataset.del); getP(p.slice(0,-1)).splice(p[p.length-1],1); markDirty(); redrawEd(); return; }
    if (b.dataset.delimg){ const p=JSON.parse(b.dataset.delimg); getP(p.slice(0,-1)).splice(p[p.length-1],1); markDirty(); redrawEd(); return; }
    if (b.dataset.mv){ const p=JSON.parse(b.dataset.mv); const arr=getP(p.slice(0,-1)); const i=p[p.length-1], j=i+(+b.dataset.d); if (j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; markDirty(); redrawEd(); return; }
    if (b.id==='setpw'){ const a=$('#np1').value, c=$('#np2').value, er=$('#nperr'); if (a.length<6){ er.textContent='Usa almeno 6 caratteri.'; er.hidden=false; return; } if (a!==c){ er.textContent='Le due password non coincidono.'; er.hidden=false; return; } C.admin.hash = await sha(a); er.hidden=true; markDirty(); toast('Password impostata. Ora pubblica le modifiche.'); return; }
    if (b.id==='newrc'){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r=crypto.getRandomValues(new Uint8Array(12)); let s=''; r.forEach((x,i)=>{ s+=A[x%A.length]; if (i%4===3 && i<11) s+='-'; }); C.admin.recovery = await sha(s); const el=$('#rcode'); el.textContent=s; el.hidden=false; markDirty(); toast('Nuovo codice creato. Annotalo e pubblica.'); return; }
    if (b.id==='save') return save();
    if (b.id==='undo'){ C = JSON.parse(JSON.stringify(PUBLISHED)); dirty=false; admMsg='Modifiche annullate.'; render(); return; }
    if (b.id==='logout'){ authed=false; try{sessionStorage.removeItem('fna-auth')}catch(_){}; location.hash='#home'; return; }
    if (b.id==='copyjson'){ const t=$('#jsonout'); navigator.clipboard.writeText(t.value).then(()=>toast('Contenuti copiati')).catch(()=>{ t.select(); }); }
  });
  claudeUse('assets').then(a => { if (!a){ $$('[data-up]').forEach(x=>{ x.style.opacity=.4; x.style.pointerEvents='none'; }); const h=$('#uphint'); if (h) h.textContent += ' Il caricamento di nuove foto è disponibile solo per chi gestisce il sito.'; } });
}
function claudeUse(name){ try { return (window.claude && window.claude.use) ? window.claude.use(name).catch(()=>null) : Promise.resolve(null); } catch(e){ return Promise.resolve(null); } }
async function uploadPhoto(file, key){
  const a = await claudeUse('assets');
  if (!a){ toast('Caricamento foto non disponibile qui.'); return; }
  try {
    toast('Caricamento in corso…');
    const blob = await shrink(file);
    const r = await a.upload(blob, {type: blob.type || 'image/jpeg'});
    const k = key || ('foto-' + (Object.keys(C.images).length+1));
    C.images[k] = r.url; markDirty(); redrawEd(); toast('Foto caricata. Ricorda di pubblicare.');
  } catch(e){ toast(e && e.code==='too_large' ? 'Foto troppo pesante.' : 'Caricamento non riuscito. Riprova.'); }
}
async function shrink(file){
  try { const bm = await createImageBitmap(file); const s=Math.min(1,1800/Math.max(bm.width,bm.height)); const c=document.createElement('canvas'); c.width=Math.round(bm.width*s); c.height=Math.round(bm.height*s); c.getContext('2d').drawImage(bm,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.82)); } catch(e){ return file; }
}
async function save(){
  const msg = t => { admMsg=t; const m=$('#admmsg'); if (m){ m.textContent=t; m.classList.toggle('dirty', dirty); } };
  const json = JSON.stringify(C, null, 1);
  const art = await claudeUse('artifact');
  const fallback = why => { msg(why); $('#fallback').innerHTML = `<div class="card" style="margin-top:30px"><b>Copia dei contenuti</b><p class="hint">Copia questo testo e sostituisci il file <b>content.json</b> del sito.</p><textarea class="inp" id="jsonout" rows="10" readonly>${esc(json)}</textarea><button class="ib" type="button" id="copyjson" style="justify-self:start">Copia</button></div>`; };
  if (!art) return fallback('Da qui non è possibile pubblicare direttamente.');
  try {
    msg('Pubblicazione in corso…');
    await art.publish({'content.json': json});
    PUBLISHED = JSON.parse(json); dirty=false; msg('Pubblicato. Il sito è aggiornato.'); toast('Modifiche pubblicate');
  } catch(e){
    const c = e && e.code;
    if (c==='not_writer' || c==='not_granted' || c==='consent_required') return fallback('Solo chi gestisce il sito può pubblicare.');
    if (c==='capability_disabled' || c==='capability_removed') return fallback('Da qui non è possibile pubblicare direttamente.');
    if (c==='conflict') return msg('Il sito è stato aggiornato altrove: la pagina si ricarica con la versione più recente.');
    if (c==='rate_limited') return msg('Troppe pubblicazioni ravvicinate: riprova tra un minuto.');
    if (c==='too_large') return msg('Contenuti troppo grandi per essere pubblicati.');
    msg('Pubblicazione non riuscita. Riprova tra poco.');
  }
}

/* ---------- boot ---------- */
let PUBLISHED = JSON.parse(JSON.stringify(DEFAULT));
lastPage = route().page;
render();
setInterval(()=>{ $$('.status').forEach(el=>{ const s=status(); el.classList.toggle('closed',!s.open); el.lastChild.textContent=s.text; }); }, 60000);
fetch('content.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
  if (!j || !j.images || dirty) return;
  for (const k of Object.keys(DEFAULT)) if (!(k in j)) j[k] = DEFAULT[k];
  for (const k of Object.keys(DEFAULT.images)) if (!(k in j.images)) j.images[k] = DEFAULT.images[k];
  if (JSON.stringify(j) === JSON.stringify(C)) return;
  C = j; PUBLISHED = JSON.parse(JSON.stringify(j)); firstRender = true; render();
}).catch(()=>{});
</script>
